version: 2.1

orbs:
  # The python orb contains a set of prepackaged CircleCI configuration you can
  # use repeatedly in your configuration files
  # Orb commands and jobs help you with common scripting around a language/tool,
  # so you don't have to copy and paste it everywhere.
  # See the orb documentation here: https://circleci.com/developer/orbs/orb/circleci/python
  python: circleci/python@4.0.0

jobs:
  build:
    docker:
      - image: cimg/python:3.13.12

    working_directory: ~/repo

    steps:
      - checkout
      - run:
          name: install dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install -r requirements_ci.txt
      - run:
          name: check code
          command: |
            . venv/bin/activate
            python -m compileall api encryption project remotes utility
            python -m pycodestyle api encryption project remotes utility
            python -m flake8 api encryption project remotes utility
